<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><style>html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>SG-SST AWES Energy</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Concepto: consola de control del asesor. Barra lateral tipo carpetas (una por empresa) + área de trabajo con tarjetas de lectura rápida. */
:root { --led: #5FE3AE;
  --bg: #EEE9DD; --panel: #FFFFFF; --panel-2: #E9E3D5; --line: #DCD4C2;
  --ink: #10201B; --muted: #5B6B66; --accent: #2E7D66; --accent-soft: #C8EEDF; --title: #8A6A1F; --side: #143A30; --side-ink: #E6F2ED; --side-muted: #93A9A1;
  --ok: #1E9E6A; --warn: #D99A1E; --bad: #D2493C; --ev: #E07B2E; --mute: #A4B2AD;
  --ok-bg: #DDF3E8; --warn-bg: #FBEFD5; --bad-bg: #F9DEDA; --ev-bg: #FBE5D3; --mute-bg: #E8EDEB;
  --shadow: 0 1px 2px rgba(16,32,27,.06), 0 8px 24px rgba(16,32,27,.06);
  --f-display: 'Sora', 'Segoe UI', system-ui, sans-serif; --f-body: 'Inter', 'Segoe UI', system-ui, sans-serif; --f-mono: 'JetBrains Mono', ui-monospace, Consolas, monospace;
  --r: 14px;
}
/* Tema claro marfil fijo (José, 2026-11-16): el modo oscuro del equipo ya no cambia los colores */
@media (prefers-color-scheme: dark) { :root[data-theme="oscuro-desactivado"] {
  --bg: #0B1512; --panel: #111F1A; --panel-2: #162822; --line: #223A32;
  --ink: #E4EFEA; --muted: #8FA59D; --accent: #9ADBC4; --accent-soft: #1B3A31; --title: #E2C27D; --side: #08110E; --side-ink: #E4EFEA; --side-muted: #7F968E;
  --ok: #4CC992; --warn: #E9B44C; --bad: #EE7466; --ev: #F09A55; --mute: #5E726B;
  --ok-bg: #133A2B; --warn-bg: #3A2F15; --bad-bg: #3D1E1A; --ev-bg: #3C2716; --mute-bg: #1C2C27;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.25); color-scheme: dark; } }
:root[data-theme="oscuro-desactivado-2"] {
  --bg: #0B1512; --panel: #111F1A; --panel-2: #162822; --line: #223A32;
  --ink: #E4EFEA; --muted: #8FA59D; --accent: #9ADBC4; --accent-soft: #1B3A31; --title: #E2C27D; --side: #08110E; --side-ink: #E4EFEA; --side-muted: #7F968E;
  --ok: #4CC992; --warn: #E9B44C; --bad: #EE7466; --ev: #F09A55; --mute: #5E726B;
  --ok-bg: #133A2B; --warn-bg: #3A2F15; --bad-bg: #3D1E1A; --ev-bg: #3C2716; --mute-bg: #1C2C27;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.25); color-scheme: dark; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5; }
.app { display: grid; grid-template-columns: 272px minmax(0, 1fr); min-height: 100vh; }

/* Barra lateral */
.side { background: var(--side); color: var(--side-ink); padding-block: 22px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 16px; display: flex; flex-direction: column; gap: 22px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.brand { display: flex; gap: 12px; align-items: center; padding: 0 6px; }
.brand img { width: 44px; height: 44px; border-radius: 50%; background: #fff; padding: 3px; }
.brand b { font-family: var(--f-display); font-weight: 600; font-size: 15px; display: block; letter-spacing: .01em; }
.brand span { font-size: 12px; color: var(--side-muted); }
.navlabel { font-size: 11px; text-transform: uppercase; letter-spacing: .12em; color: var(--side-muted); padding: 0 8px; margin-bottom: -12px; }
.nav { display: flex; flex-direction: column; gap: 4px; }
.nav a { display: grid; grid-template-columns: 34px minmax(0,1fr) auto; gap: 10px; align-items: center; padding: 9px 8px; border-radius: 10px; color: var(--side-ink); text-decoration: none; transition: background .15s; }
.nav a:hover { background: rgba(255,255,255,.06); }
.nav a:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.nav a.on { background: color-mix(in srgb, var(--side-hi, #5FD3A8) 14%, transparent); box-shadow: inset 3px 0 0 var(--side-hi, #5FD3A8); }
.nav .ic { width: 34px; height: 34px; border-radius: 8px; background: #fff; display: grid; place-items: center; overflow: hidden; }
.nav .ic img { width: 30px; height: 30px; object-fit: contain; }
.nav .ic.home { background: rgba(95,211,168,.16); color: #5FD3A8; }
.nav .nm { font-size: 13.5px; font-weight: 500; line-height: 1.25; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav .nm small { display: block; font-size: 11.5px; color: var(--side-muted); font-weight: 400; }
.nav .sc { font-family: var(--f-mono); font-size: 12px; padding: 2px 7px; border-radius: 6px; background: rgba(255,255,255,.08); color: var(--side-ink); }
.side-foot { margin-top: auto; font-size: 12.5px; color: var(--side-ink); opacity: .9; padding: 12px 8px 0; line-height: 1.6; border-top: 1px solid rgba(255,255,255,.14); }

/* Área principal */
.main { padding-block: 28px 48px; padding-left: 36px; padding-right: max(36px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 26px; min-width: 0; max-width: 1280px; }
.eyebrow { font-size: 11.5px; text-transform: uppercase; letter-spacing: .14em; color: var(--accent); font-weight: 600; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; color: var(--title); }
h1 { overflow-wrap: break-word; font-size: clamp(21px, 3.2vw, 34px); font-weight: 600; letter-spacing: -.015em; line-height: 1.15; }
h2 { font-size: 19px; font-weight: 600; letter-spacing: -.005em; }
h3 { font-size: 15px; font-weight: 600; }
.lead { font-size: 16.5px; color: var(--muted); max-width: 72ch; margin: 8px 0 0; }
.lead b { color: var(--ink); font-weight: 600; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); padding: 22px; min-width: 0; }
.sec-h { display: flex; justify-content: space-between; align-items: end; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
.sec-h p { margin: 4px 0 0; color: var(--muted); font-size: 13.5px; max-width: 70ch; }

/* KPI */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; }
.kpi { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; display: flex; flex-direction: column; gap: 4px; position: relative; overflow: hidden; }
.kpi .lbl { font-size: 12.5px; color: var(--muted); }
.kpi .val { font-family: var(--f-display); font-size: 30px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -.02em; line-height: 1.1; }
.kpi .val small { font-size: 14px; color: var(--muted); font-weight: 500; margin-left: 4px; }
.kpi .hint { font-size: 12px; color: var(--muted); }
.kpi::after { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--k, var(--accent)); }

/* Tarjetas de empresa */
.cos { display: grid; grid-template-columns: repeat(auto-fit, minmax(330px, 1fr)); gap: 16px; }
.co { display: flex; flex-direction: column; gap: 16px; text-decoration: none; color: inherit; transition: transform .15s, border-color .15s; }
.co:hover { transform: translateY(-2px); border-color: var(--accent); }
.co:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.co-top { display: grid; grid-template-columns: 52px minmax(0,1fr) auto; gap: 12px; align-items: center; }
.logo { width: 52px; height: 52px; border-radius: 12px; background: #fff; border: 1px solid var(--line); display: grid; place-items: center; overflow: hidden; }
.logo img { width: 46px; height: 46px; object-fit: contain; }
.co-top b { font-family: var(--f-display); font-weight: 600; font-size: 14.5px; line-height: 1.25; display: block; }
.co-top span { font-size: 12.5px; color: var(--muted); display: block; margin-top: 2px; }
.co-mid { display: grid; grid-template-columns: 116px minmax(0,1fr); gap: 18px; align-items: center; }
.cyc-mini { display: flex; flex-direction: column; gap: 8px; }
.cm { display: grid; grid-template-columns: 70px minmax(0,1fr) 40px; gap: 8px; align-items: center; font-size: 12.5px; }
.cm span:first-child { color: var(--muted); }
.cm em { font-style: normal; font-family: var(--f-mono); font-size: 12px; text-align: right; }
.track { height: 7px; border-radius: 99px; background: var(--panel-2); overflow: hidden; }
.track i { display: block; height: 100%; border-radius: 99px; background: var(--accent); }
.stack { display: flex; height: 10px; border-radius: 99px; overflow: hidden; background: var(--panel-2); gap: 2px; }
.stack i { display: block; height: 100%; }
.co-foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 12px; }
.co-foot .go { color: var(--accent); font-weight: 600; }
.leg { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--muted); margin-top: 6px; }
.leg span { display: inline-flex; align-items: center; gap: 5px; }
.leg i { width: 9px; height: 9px; border-radius: 3px; display: inline-block; }

.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 600; padding: 4px 10px; border-radius: 99px; white-space: nowrap; letter-spacing: .02em; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.p-ok { background: var(--ok-bg); color: var(--ok); } .p-warn { background: var(--warn-bg); color: var(--warn); }
.p-bad { background: var(--bad-bg); color: var(--bad); } .p-ev { background: var(--ev-bg); color: var(--ev); } .p-mute { background: var(--mute-bg); color: var(--muted); }

/* Gauge */
.gauge { position: relative; width: 100%; max-width: 116px; aspect-ratio: 1; }
.gauge svg { width: 100%; height: 100%; display: block; }
.gauge .gv { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.gauge .gv b { font-family: var(--f-display); font-size: 28px; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; }
.gauge .gv small { font-size: 11px; color: var(--muted); margin-top: 3px; }
.gauge.big { max-width: 170px; } .gauge.big .gv b { font-size: 42px; }

/* Vencimientos */
.timeline { display: flex; flex-direction: column; }
.tl { display: grid; grid-template-columns: 84px 30px minmax(0,1fr) auto; gap: 12px; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--line); }
.tl:last-child { border-bottom: 0; }
.tl .d { font-family: var(--f-mono); font-size: 12.5px; color: var(--muted); }
.tl .lg { width: 30px; height: 30px; border-radius: 8px; background: #fff; border: 1px solid var(--line); display: grid; place-items: center; overflow: hidden; }
.tl .lg img { width: 26px; height: 26px; object-fit: contain; }
.tl .t { font-size: 13.5px; min-width: 0; } .tl .t small { display: block; color: var(--muted); font-size: 12px; }
.num { font-family: var(--f-mono); font-size: 12px; color: var(--accent); font-weight: 500; margin-right: 6px; }

/* Ficha empresa */
.hero { display: grid; grid-template-columns: 96px minmax(0,1fr) auto; gap: 20px; align-items: center; }
.hero .logo { width: 96px; height: 96px; border-radius: 18px; } .hero .logo img { width: 86px; height: 86px; }
.hero .meta { color: var(--muted); font-size: 14px; margin-top: 6px; display: flex; flex-wrap: wrap; gap: 4px 16px; }
.hero .meta b { color: var(--ink); font-weight: 500; }
.norma { grid-column: 1 / -1; margin-top: 12px; padding: 10px 14px; border-radius: 12px; background: var(--accent-soft); border-left: 3px solid var(--title); display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; }
.norma .nt { font-family: var(--f-display); font-weight: 700; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--title); }
.norma .nm { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; font-size: 12px; flex: 1 1 min(320px, 100%); }
.hero .actv { margin-top: 4px; font-size: 13px; color: var(--muted); } .hero .actv b { color: var(--ink); font-weight: 500; }
.bienv { display: flex; gap: 16px; align-items: center; padding: 18px 22px; margin-bottom: 18px; border-radius: var(--r); background: linear-gradient(120deg, #3F6D79 0%, #557F8A 100%); border: 1px solid #557F8A; color: #FFFFFF; box-shadow: var(--shadow); position: relative; overflow: hidden; }
.bienv::after { content: ''; position: absolute; right: -60px; top: -60px; width: 220px; height: 220px; border-radius: 50%; border: 1px solid #8FB0B8; opacity: .8; }
.bv-ic { flex: none; width: 44px; height: 44px; border-radius: 50%; border: 1.5px solid #F3DDA6; display: grid; place-items: center; }
.bv-ic span { width: 12px; height: 12px; border-radius: 50%; background: #F3DDA6; box-shadow: 0 0 0 6px color-mix(in srgb, #F3DDA6 18%, transparent); animation: bvp 2.4s ease-in-out infinite; }
@keyframes bvp { 50% { box-shadow: 0 0 0 10px color-mix(in srgb, #F3DDA6 6%, transparent); } }
@media (prefers-reduced-motion: reduce) { .bv-ic span { animation: none; } }
.bv-k { font-size: 13.5px; letter-spacing: .12em; position: relative; z-index: 1; text-transform: uppercase; color: #F3DDA6; font-weight: 700; }
.bv-t { font-family: var(--f-display); font-size: clamp(17px, 2.4vw, 22px); font-weight: 600; color: #FFFFFF; line-height: 1.3; margin-top: 3px; text-wrap: balance; }
.bv-s { font-size: clamp(14px, 1.7vw, 15.5px); font-weight: 500; color: #E6F0F2; margin-top: 8px; line-height: 1.5; }
.bv-s b { color: #F3DDA6; font-weight: 700; }
.bv-h { font-family: var(--f-display); font-size: clamp(24px, 3.4vw, 32px); font-weight: 600; color: #FFFFFF; margin-top: 4px; line-height: 1.2; }
.bv-tx { flex: 1; min-width: 0; position: relative; z-index: 1; }
@media (max-width: 640px) { .bv-ic { display: none; } .bv-k { font-size: 13.5px; letter-spacing: .06em; } .bienv::after { right: -110px; top: -120px; opacity: .35; } }
.bv-pt { flex: none; position: relative; z-index: 1; text-align: center; background: #FFF8E7; border-radius: 16px; padding: 12px 20px 10px; min-width: 150px; box-shadow: 0 6px 18px rgba(0,0,0,.18); border: 2px solid #F3DDA6; }
.bv-pt .k { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; font-weight: 700; color: #3F6D79; }
.bv-pt .v { font-family: var(--f-display); font-size: clamp(36px, 5vw, 48px); font-weight: 700; line-height: 1.05; color: #7A2440; margin-top: 2px; }
.bv-pt .v small { font-size: .5em; font-weight: 700; margin-left: 2px; }
.bv-pt .v.sin { font-size: 22px; padding: 8px 0 4px; }
.bv-pt .v.cic { font-size: clamp(24px, 3vw, 30px); padding: 6px 0 4px; line-height: 1.15; text-wrap: balance; max-width: 260px; margin-inline: auto; }
.bv-pt .e { font-size: 12px; font-weight: 700; margin-top: 4px; padding: 3px 10px; border-radius: 999px; display: inline-block; }
@media (max-width: 640px) { .bienv { flex-wrap: wrap; } .bv-pt { width: 100%; padding: 10px 14px; } .bv-pt .v.sin { font-size: 20px; padding: 4px 0 2px; } .bv-pt .v.cic { font-size: 26px; } }
.velo-w { text-align: center; margin: 4px auto 6px; }
.velo-w .velo { display: block; width: 100%; max-width: 280px; height: auto; margin: 0 auto; }
.velo-w .vn { font-family: var(--f-display); font-size: 40px; font-weight: 700; color: #7A2440; line-height: 1; margin-top: 2px; }
.velo-w .vn small { font-size: .5em; margin-left: 2px; }
.medidor { display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); gap: 26px; align-items: center; margin: 0 0 18px; padding: 20px 26px; border: 2px solid #F3DDA6; background: linear-gradient(180deg, #FFFCF4, #FFF6E2); }
.medidor .velo-w .velo { max-width: 340px; }
.medidor .velo-w .vn { font-size: clamp(42px, 6vw, 56px); }
.medidor .md-tx h2 { font-size: clamp(20px, 2.6vw, 26px); margin: 2px 0 8px; color: #3F6D79; }
.medidor .md-tx p { margin: 10px 0 12px; font-size: 15px; line-height: 1.5; color: var(--ink); text-align: justify; }
.md-ley { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 13px; color: var(--muted); }
.md-ley span { display: inline-flex; align-items: center; gap: 6px; }
.md-ley i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.md-ley b { color: var(--ink); }
.ciclos4 { margin: 0 0 18px; padding: 20px 26px; }
.ciclos4 .c4-h h2 { margin: 2px 0 4px; font-size: clamp(19px, 2.4vw, 23px); color: #3F6D79; }
.ciclos4 .c4-h p { margin: 0 0 14px; font-size: 14.5px; color: var(--ink); text-align: justify; }
.c4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; counter-reset: paso; }
.c4 .st { display: flex; flex-direction: column; position: relative; padding: 14px 14px 12px; border-radius: 14px; border: 1.5px solid #E6DCC4; background: #FBF8F0; }
.c4 .st.on { border-color: var(--pc); background: linear-gradient(180deg, #FFFFFF, #F6FBF8); box-shadow: 0 4px 14px rgba(20, 58, 48, .08); }

.c4 .st .nm i { flex: none; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-size: 13px; font-weight: 700; color: #fff; background: #B9B2A2; }
.c4 .st.on .nm i { background: var(--pc); }

.c4 .st .qs { flex: 1; hyphens: auto; -webkit-hyphens: auto; margin: 0 0 10px; font-size: 13.5px; line-height: 1.4; color: var(--ink); text-align: justify; }
.c4 .st .br { height: 8px; border-radius: 6px; background: #ECE5D3; overflow: hidden; }
.c4 .st .br span { display: block; height: 100%; border-radius: 6px; background: var(--pc); }
.c4 .st .es { margin-top: 6px; font-size: 13px; font-weight: 700; color: #7D7766; }
.c4 .st.on .es { color: #143A30; }
.c4-t { margin-top: 12px; font-size: 13.5px; color: var(--ink); text-align: justify; }
@media (max-width: 900px) { .c4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 480px) { .ciclos4 { padding: 16px; } .c4 { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 760px) { .medidor { grid-template-columns: minmax(0, 1fr); gap: 10px; padding: 16px; text-align: center; } .md-ley { justify-content: center; } }
@media (max-width: 640px) {
  .eyebrow, .pill, .bv-pt .k, .bv-pt .e, .norma .nt, .norma .ob-tag, .norma .nm, .norma .nm > b, .norma .el, .norma .oblig, .ph .tag, .ph dl, .ph dd, .ph dt, .chip, .tab, .navlabel, .nav small, .fk, .foot small, .md-ley, .pi small, .tbl td, .tbl th, table td, table th, .meta, .actv, .nov, .sec-h p { font-size: max(12.5px, 1em) !important; }
  table td, table th { font-size: 12.5px !important; }
  .ph dd { white-space: nowrap; } .ph dd { font-family: var(--f-body) !important; font-weight: 600; }
  .norma > * { min-width: 0; max-width: 100%; } .norma .oblig { box-sizing: border-box; } .norma .ob-tag { white-space: normal !important; letter-spacing: .05em !important; } .norma .oblig > span:last-child { flex: 1 1 100% !important; min-width: 0; }
}
@media (max-width: 480px) {
  .phva { grid-template-columns: minmax(0, 1fr) !important; }
  .ph { display: grid !important; grid-template-columns: auto minmax(0, 1fr); grid-template-areas: 'tag tag' 'ring dl'; align-items: center; column-gap: 16px; }
  .ph > .tag { grid-area: tag; } .ph > svg, .ph > .ring { grid-area: ring; } .ph > dl { grid-area: dl; }
}
.velo .led { transition: opacity .4s; opacity: .55; }
.velo.encendido .led { opacity: 1; animation: ledp 2.8s ease-in-out infinite; }
@keyframes ledp { 50% { opacity: .82; } }

function estadoDe(r) {
  let estado, vence = null;
  if (!r.documento) estado = 'Sin iniciar';
  else if (r.documento === 'No') estado = 'Falta documento';
  else {
    const dias = FREQ[r.frecuencia] || 0; const u = pd(r.ultima_evidencia);
    vence = u != null ? (dias ? u + dias * 864e5 : null) : pd(r.primera_entrega);
    if (vence == null) estado = (u == null && r.frecuencia !== 'Cuando ocurra') ? 'Sin evidencia' : 'Al día';
    else if (vence < HOY) estado = 'Atrasado';
    else if ((vence - HOY) / 864e5 <= AVISO) estado = 'Por vencer';
    else estado = 'Al día';
    if (r.calificacion === 'No cumple' && estado === 'Al día') estado = 'Sin evidencia';
  }
  return {...r, estado, vence, faltan: vence == null ? null : Math.round((vence - HOY) / 864e5)};

  const evaluada = rs.some((r) => r.calificacion === 'Cumple totalmente' || r.calificacion === 'No cumple');
  const ok = (r) => r.calificacion === 'Cumple totalmente' || r.calificacion === 'No aplica';
