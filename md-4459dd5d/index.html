<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><style>html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>SG-SST MD Enchapes</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Concepto: consola de control del asesor. Barra lateral tipo carpetas (una por empresa) + área de trabajo con tarjetas de lectura rápida. */
:root {
  --bg: #F3F6F5; --panel: #FFFFFF; --panel-2: #EAF1EE; --line: #D9E3DF;
  --ink: #10201B; --muted: #5B6B66; --accent: #2E7D66; --accent-soft: #C8EEDF; --side: #0F1F1A; --side-ink: #E6F2ED; --side-muted: #93A9A1;
  --ok: #1E9E6A; --warn: #D99A1E; --bad: #D2493C; --ev: #E07B2E; --mute: #A4B2AD;
  --ok-bg: #DDF3E8; --warn-bg: #FBEFD5; --bad-bg: #F9DEDA; --ev-bg: #FBE5D3; --mute-bg: #E8EDEB;
  --shadow: 0 1px 2px rgba(16,32,27,.06), 0 8px 24px rgba(16,32,27,.06);
  --f-display: 'Sora', 'Segoe UI', system-ui, sans-serif; --f-body: 'Inter', 'Segoe UI', system-ui, sans-serif; --f-mono: 'JetBrains Mono', ui-monospace, Consolas, monospace;
  --r: 14px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0B1512; --panel: #111F1A; --panel-2: #162822; --line: #223A32;
  --ink: #E4EFEA; --muted: #8FA59D; --accent: #9ADBC4; --accent-soft: #1B3A31; --side: #08110E; --side-ink: #E4EFEA; --side-muted: #7F968E;
  --ok: #4CC992; --warn: #E9B44C; --bad: #EE7466; --ev: #F09A55; --mute: #5E726B;
  --ok-bg: #133A2B; --warn-bg: #3A2F15; --bad-bg: #3D1E1A; --ev-bg: #3C2716; --mute-bg: #1C2C27;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.25); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0B1512; --panel: #111F1A; --panel-2: #162822; --line: #223A32;
  --ink: #E4EFEA; --muted: #8FA59D; --accent: #9ADBC4; --accent-soft: #1B3A31; --side: #08110E; --side-ink: #E4EFEA; --side-muted: #7F968E;
  --ok: #4CC992; --warn: #E9B44C; --bad: #EE7466; --ev: #F09A55; --mute: #5E726B;
  --ok-bg: #133A2B; --warn-bg: #3A2F15; --bad-bg: #3D1E1A; --ev-bg: #3C2716; --mute-bg: #1C2C27;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.25); color-scheme: dark; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5; }
.app { display: grid; grid-template-columns: 272px minmax(0, 1fr); min-height: 100vh; }

/* Barra lateral */
.side { background: var(--side); color: var(--side-ink); padding-block: 22px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 16px; display: flex; flex-direction: column; gap: 22px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.brand { display: flex; gap: 12px; align-items: center; padding: 0 6px; }
.brand img { width: 44px; height: 44px; border-radius: 50%; background: #fff; padding: 3px; }
.brand b { font-family: var(--f-display); font-weight: 600; font-size: 15px; display: block; letter-spacing: .01em; }
.brand span { font-size: 12px; color: var(--side-muted); }
.navlabel { font-size: 11px; text-transform: uppercase; letter-spacing: .12em; color: var(--side-muted); padding: 0 8px; margin-bottom: -12px; }
.nav { display: flex; flex-direction: column; gap: 4px; }
.nav a { display: grid; grid-template-columns: 34px minmax(0,1fr) auto; gap: 10px; align-items: center; padding: 9px 8px; border-radius: 10px; color: var(--side-ink); text-decoration: none; transition: background .15s; }
.nav a:hover { background: rgba(255,255,255,.06); }
.nav a:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.nav a.on { background: rgba(95,211,168,.14); box-shadow: inset 3px 0 0 #5FD3A8; }
.nav .ic { width: 34px; height: 34px; border-radius: 8px; background: #fff; display: grid; place-items: center; overflow: hidden; }
.nav .ic img { width: 30px; height: 30px; object-fit: contain; }
.nav .ic.home { background: rgba(95,211,168,.16); color: #5FD3A8; }
.nav .nm { font-size: 13.5px; font-weight: 500; line-height: 1.25; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav .nm small { display: block; font-size: 11.5px; color: var(--side-muted); font-weight: 400; }
.nav .sc { font-family: var(--f-mono); font-size: 12px; padding: 2px 7px; border-radius: 6px; background: rgba(255,255,255,.08); color: var(--side-ink); }
.side-foot { margin-top: auto; font-size: 11.5px; color: var(--side-muted); padding: 0 8px; line-height: 1.55; }

/* Área principal */
.main { padding-block: 28px 48px; padding-left: 36px; padding-right: max(36px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 26px; min-width: 0; max-width: 1280px; }
.eyebrow { font-size: 11.5px; text-transform: uppercase; letter-spacing: .14em; color: var(--accent); font-weight: 600; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; }
h1 { font-size: clamp(24px, 3.2vw, 34px); font-weight: 600; letter-spacing: -.015em; line-height: 1.15; }
h2 { font-size: 19px; font-weight: 600; letter-spacing: -.005em; }
h3 { font-size: 15px; font-weight: 600; }
.lead { font-size: 16.5px; color: var(--muted); max-width: 72ch; margin: 8px 0 0; }
.lead b { color: var(--ink); font-weight: 600; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); padding: 22px; min-width: 0; }
.sec-h { display: flex; justify-content: space-between; align-items: end; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
.sec-h p { margin: 4px 0 0; color: var(--muted); font-size: 13.5px; max-width: 70ch; }

/* KPI */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; }
.kpi { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; display: flex; flex-direction: column; gap: 4px; position: relative; overflow: hidden; }
.kpi .lbl { font-size: 12.5px; color: var(--muted); }
.kpi .val { font-family: var(--f-display); font-size: 30px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -.02em; line-height: 1.1; }
.kpi .val small { font-size: 14px; color: var(--muted); font-weight: 500; margin-left: 4px; }
.kpi .hint { font-size: 12px; color: var(--muted); }
.kpi::after { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--k, var(--accent)); }

/* Tarjetas de empresa */
.cos { display: grid; grid-template-columns: repeat(auto-fit, minmax(330px, 1fr)); gap: 16px; }
.co { display: flex; flex-direction: column; gap: 16px; text-decoration: none; color: inherit; transition: transform .15s, border-color .15s; }
.co:hover { transform: translateY(-2px); border-color: var(--accent); }
.co:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.co-top { display: grid; grid-template-columns: 52px minmax(0,1fr) auto; gap: 12px; align-items: center; }
.logo { width: 52px; height: 52px; border-radius: 12px; background: #fff; border: 1px solid var(--line); display: grid; place-items: center; overflow: hidden; }
.logo img { width: 46px; height: 46px; object-fit: contain; }
.co-top b { font-family: var(--f-display); font-weight: 600; font-size: 14.5px; line-height: 1.25; display: block; }
.co-top span { font-size: 12.5px; color: var(--muted); display: block; margin-top: 2px; }
.co-mid { display: grid; grid-template-columns: 116px minmax(0,1fr); gap: 18px; align-items: center; }
.cyc-mini { display: flex; flex-direction: column; gap: 8px; }
.cm { display: grid; grid-template-columns: 70px minmax(0,1fr) 40px; gap: 8px; align-items: center; font-size: 12.5px; }
.cm span:first-child { color: var(--muted); }
.cm em { font-style: normal; font-family: var(--f-mono); font-size: 12px; text-align: right; }
.track { height: 7px; border-radius: 99px; background: var(--panel-2); overflow: hidden; }
.track i { display: block; height: 100%; border-radius: 99px; background: var(--accent); }
.stack { display: flex; height: 10px; border-radius: 99px; overflow: hidden; background: var(--panel-2); gap: 2px; }
.stack i { display: block; height: 100%; }
.co-foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 12px; }
.co-foot .go { color: var(--accent); font-weight: 600; }
.leg { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--muted); margin-top: 6px; }
.leg span { display: inline-flex; align-items: center; gap: 5px; }
.leg i { width: 9px; height: 9px; border-radius: 3px; display: inline-block; }

.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 600; padding: 4px 10px; border-radius: 99px; white-space: nowrap; letter-spacing: .02em; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.p-ok { background: var(--ok-bg); color: var(--ok); } .p-warn { background: var(--warn-bg); color: var(--warn); }
.p-bad { background: var(--bad-bg); color: var(--bad); } .p-ev { background: var(--ev-bg); color: var(--ev); } .p-mute { background: var(--mute-bg); color: var(--muted); }

/* Gauge */
.gauge { position: relative; width: 100%; max-width: 116px; aspect-ratio: 1; }
.gauge svg { width: 100%; height: 100%; display: block; }
.gauge .gv { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.gauge .gv b { font-family: var(--f-display); font-size: 28px; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; }
.gauge .gv small { font-size: 11px; color: var(--muted); margin-top: 3px; }
.gauge.big { max-width: 170px; } .gauge.big .gv b { font-size: 42px; }

/* Vencimientos */
.timeline { display: flex; flex-direction: column; }
.tl { display: grid; grid-template-columns: 84px 30px minmax(0,1fr) auto; gap: 12px; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--line); }
.tl:last-child { border-bottom: 0; }
.tl .d { font-family: var(--f-mono); font-size: 12.5px; color: var(--muted); }
.tl .lg { width: 30px; height: 30px; border-radius: 8px; background: #fff; border: 1px solid var(--line); display: grid; place-items: center; overflow: hidden; }
.tl .lg img { width: 26px; height: 26px; object-fit: contain; }
.tl .t { font-size: 13.5px; min-width: 0; } .tl .t small { display: block; color: var(--muted); font-size: 12px; }
.num { font-family: var(--f-mono); font-size: 12px; color: var(--accent); font-weight: 500; margin-right: 6px; }

/* Ficha empresa */
.hero { display: grid; grid-template-columns: 96px minmax(0,1fr) auto; gap: 20px; align-items: center; }
.hero .logo { width: 96px; height: 96px; border-radius: 18px; } .hero .logo img { width: 86px; height: 86px; }
.hero .meta { color: var(--muted); font-size: 14px; margin-top: 6px; display: flex; flex-wrap: wrap; gap: 4px 16px; }
.hero .meta b { color: var(--ink); font-weight: 500; }
.norma { grid-column: 1 / -1; margin-top: 14px; padding: 12px 16px; border-radius: 12px; background: var(--accent-soft); border-left: 4px solid var(--accent); display: grid; gap: 6px; }
.norma .nt { font-family: var(--f-display); font-weight: 700; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink); }
.norma .ns { font-size: 13.5px; color: var(--ink); text-align: justify; hyphens: auto; -webkit-hyphens: auto; }
.norma .nm { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12.5px; }
.norma .nm > b { color: var(--accent); font-weight: 600; margin-right: 2px; }
.norma .chip { border: 1px solid var(--accent); color: var(--ink); background: var(--panel); border-radius: 10px; padding: 2px 10px; font-weight: 500; }
.norma .el { font-size: 12.5px; color: var(--muted); } .norma .el b { color: var(--ink); font-weight: 600; }
.nov { border-radius: var(--r); padding: 16px 20px; background: var(--warn-bg); border: 1px solid color-mix(in srgb, var(--warn) 35%, transparent); line-height: 1.6; font-size: 15px; }
.nov.ok { background: var(--ok-bg); border-color: color-mix(in srgb, var(--ok) 35%, transparent); }
.nov.mute { background: var(--panel-2); border-color: var(--line); }
.nov .when { font-family: var(--f-display); font-weight: 600; }
.row2 { display: grid; grid-template-columns: minmax(260px, 1fr) minmax(0, 2.2fr); gap: 16px; }
.score { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-align: center; }
.score p { margin: 0; color: var(--muted); font-size: 13px; max-width: 32ch; }
.phva { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 12px; }
.ph { border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 10px; background: var(--panel); }
.ph .tag { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; font-weight: 700; color: var(--pc); }
.ph .ring { width: 80px; height: 80px; position: relative; }
.ph .ring b { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--f-display); font-weight: 600; font-size: 15px; letter-spacing: -.02em; }
.ph dl { margin: 0; display: grid; grid-template-columns: auto auto; gap: 3px 10px; font-size: 12.5px; }
.ph dt { color: var(--muted); } .ph dd { margin: 0; text-align: right; font-family: var(--f-mono); font-size: 12px; }
.row3 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.6fr); gap: 16px; }
.donut-w { display: grid; grid-template-columns: 150px minmax(0,1fr); gap: 18px; align-items: center; }
.donut-w svg { width: 100%; max-width: 150px; height: auto; }
.donut-l { display: flex; flex-direction: column; gap: 8px; font-size: 13.5px; }
.donut-l div { display: grid; grid-template-columns: 12px minmax(0,1fr) auto; gap: 8px; align-items: center; }
.donut-l i { width: 12px; height: 12px; border-radius: 4px; }
.donut-l b { font-family: var(--f-mono); font-weight: 500; }

.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
.tab { border: 1px solid var(--line); background: var(--panel); color: var(--ink); font: inherit; font-size: 13px; padding: 7px 13px; border-radius: 99px; cursor: pointer; display: inline-flex; gap: 8px; align-items: center; }
.tab b { font-family: var(--f-mono); font-size: 11.5px; background: var(--panel-2); padding: 1px 7px; border-radius: 99px; font-weight: 500; }
.tab.on { background: var(--ink); color: var(--panel); border-color: var(--ink); } .tab.on b { background: rgba(127,127,127,.3); color: inherit; }
.tab:focus-visible, .chip:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.pend { display: flex; flex-direction: column; gap: 8px; }
.pi { display: grid; grid-template-columns: 58px minmax(0,1fr) auto; gap: 12px; align-items: center; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; border-left: 4px solid var(--sc, var(--line)); }
.pi .n { font-family: var(--f-mono); font-size: 13px; color: var(--accent); }
.pi .t { min-width: 0; font-size: 14px; font-weight: 500; } .pi .t small { display: block; font-weight: 400; color: var(--muted); font-size: 12.5px; margin-top: 2px; }
.pi .r { text-align: right; display: flex; flex-direction: column; align-items: end; gap: 4px; } .pi .r small { font-size: 12px; color: var(--muted); }
.empty { padding: 22px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 12px; }
.empty b { color: var(--ok); }

.tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
.chip { border: 1px solid var(--line); background: transparent; color: var(--ink); font: inherit; font-size: 12.5px; padding: 5px 11px; border-radius: 99px; cursor: pointer; }
.chip.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
.search { flex: 1 1 200px; min-width: 0; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 10px; padding: 8px 12px; font: inherit; font-size: 13.5px; }
.tw { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; }
table { border-collapse: collapse; width: 100%; min-width: 860px; font-size: 13px; font-variant-numeric: tabular-nums; }
th { text-align: left; font-weight: 600; font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); background: var(--panel-2); padding: 10px 12px; position: sticky; top: 0; }
td { padding: 10px 12px; border-top: 1px solid var(--line); vertical-align: top; text-align: justify; hyphens: auto; }
td.c, th.c { text-align: center; } td.m { font-family: var(--f-mono); font-size: 12.5px; white-space: nowrap; }
tr.cyc td { background: var(--accent-soft); color: var(--accent); font-weight: 700; font-size: 11.5px; letter-spacing: .12em; text-transform: uppercase; padding: 7px 12px; }

.foot { color: var(--muted); font-size: 12.5px; border-top: 1px solid var(--line); padding-top: 16px; display: flex; flex-wrap: wrap; gap: 6px 18px; justify-content: space-between; }
.legend-box { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px 20px; font-size: 13px; color: var(--muted); }
.legend-box div { display: flex; gap: 10px; align-items: start; } .legend-box .pill { flex: none; }
.tip { position: fixed; pointer-events: none; z-index: 30; background: var(--ink); color: var(--panel); font-size: 12px; padding: 6px 10px; border-radius: 8px; white-space: nowrap; opacity: 0; transition: opacity .12s; }
.rise { animation: rise .35s ease both; }
@keyframes rise { from { transform: translateY(6px); opacity: .6; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .rise { animation: none; } .co { transition: none; } }


.toprow { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; margin-bottom: 6px; }
.live { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 600; color: var(--muted); padding: 4px 10px; border: 1px solid var(--line); border-radius: 99px; background: var(--panel); }
.live i { width: 8px; height: 8px; border-radius: 50%; background: var(--mute); }
.live.vivo { color: var(--ok); } .live.vivo i { background: var(--ok); box-shadow: 0 0 0 0 var(--ok); animation: pulse 2s infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--ok) 60%, transparent); } 70% { box-shadow: 0 0 0 7px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
.btn { font: inherit; font-size: 13px; font-weight: 600; border: 1px solid var(--accent); background: var(--accent); color: var(--panel); padding: 8px 14px; border-radius: 10px; cursor: pointer; white-space: nowrap; }
.btn:hover { filter: brightness(1.06); } .btn:disabled { opacity: .6; cursor: default; }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn.sm { font-size: 12px; padding: 5px 10px; border-radius: 8px; }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.linkc { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.linkc input { flex: 1 1 260px; min-width: 0; font: inherit; font-size: 13px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; background: transparent; color: var(--ink); }
.linkc a.btn { text-decoration: none; display: inline-block; }
.regf { margin-top: 12px; padding: 12px 14px; border: 1px dashed var(--accent); border-radius: 12px; display: grid; gap: 8px; font-size: 13.5px; }
.regf p { margin: 0; color: var(--muted); } .regf p b { color: var(--ink); font-weight: 600; }
.regf select { flex: 1 1 0; width: 100%; min-width: 0; max-width: 100%; } .regf .btn { flex: 0 0 auto; } .regf .linkc { flex-wrap: nowrap; } @media (max-width: 560px) { .regf .linkc { flex-wrap: wrap; } }
.btn.danger { color: var(--bad); border-color: var(--bad); }
.lnk { color: var(--accent); font-size: 12.5px; font-weight: 600; }
.ov { position: fixed; inset: 0; z-index: 50; background: rgba(5,12,10,.55); display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.modal { width: min(520px, 100%); max-height: 100%; overflow-y: auto; background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 18px; padding: 24px; display: flex; flex-direction: column; gap: 8px; box-shadow: 0 20px 60px rgba(0,0,0,.35); }
.modal h2 { font-size: 18px; margin-bottom: 2px; }
.modal .mut { color: var(--muted); font-size: 13px; margin: 0 0 8px; }
.modal label { font-size: 13px; font-weight: 600; margin-top: 6px; }
.modal input[type=text], .modal select, .modal input[type=date], .modal textarea, .modal input[type=file] { font: inherit; font-size: 14px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 10px; padding: 9px 12px; width: 100%; }
.modal textarea { resize: vertical; }
.modal .chk { display: flex; gap: 10px; align-items: start; font-weight: 500; background: var(--ok-bg); padding: 10px 12px; border-radius: 10px; }
.modal .chk input { margin-top: 3px; accent-color: var(--ok); }
.modal .acts { display: flex; justify-content: end; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.err { color: var(--bad); font-size: 13px; margin: 4px 0 0; }
.toast { position: fixed; left: 50%; bottom: max(24px, calc(env(safe-area-inset-bottom, 0px) + 16px)); transform: translateX(-50%); z-index: 60; background: var(--ink); color: var(--panel); padding: 10px 16px; border-radius: 12px; font-size: 13.5px; box-shadow: var(--shadow); transition: opacity .4s; max-width: calc(100% - 32px); }
.toast.out { opacity: 0; }
@media (max-width: 1100px) { .phva { grid-template-columns: repeat(2, minmax(0,1fr)); } .row2, .row3 { grid-template-columns: minmax(0,1fr); } }
@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0,1fr); }
  .side { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; height: auto; flex-direction: row; align-items: center; gap: 10px; padding-block: 10px; padding-right: max(16px, env(safe-area-inset-right, 0px)); overflow-x: auto; overflow-y: hidden; }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 25; background: var(--side); }
  .brand span, .brand b, .navlabel, .side-foot { display: none; }
  .brand { padding: 0; flex: none; } .brand img { width: 36px; height: 36px; }
  .nav { flex-direction: row; gap: 6px; }
  .nav a { grid-template-columns: 28px auto; padding: 6px 10px 6px 6px; flex: none; gap: 8px; }
  .nav a .sc { display: none; } .nav .ic { width: 28px; height: 28px; } .nav .ic img { width: 25px; height: 25px; }
  .nav .nm { font-size: 12.5px; } .nav .nm small { display: none; }
  .nav a.on { box-shadow: inset 0 -2px 0 #5FD3A8; }
  .main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 40px; gap: 20px; }
}
@media (max-width: 560px) {
  .hero { grid-template-columns: 64px minmax(0,1fr); } .hero .logo { width: 64px; height: 64px; border-radius: 14px; } .hero .logo img { width: 56px; height: 56px; }
  .hero > .pill { grid-column: 1 / -1; justify-self: start; }
  .co-mid { grid-template-columns: 96px minmax(0,1fr); gap: 12px; }
  .cos { grid-template-columns: minmax(0,1fr); }
  .donut-w { grid-template-columns: minmax(0,1fr); justify-items: center; } .donut-l { width: 100%; }
  .pi { grid-template-columns: 48px minmax(0,1fr); } .pi .r { grid-column: 2; align-items: start; text-align: left; flex-direction: row; gap: 8px; align-items: center; }
  .tl { grid-template-columns: 30px minmax(0,1fr); } .tl .d { grid-column: 2; grid-row: 2; } .tl .lg { grid-row: span 2; } .tl .pill { grid-column: 2; justify-self: start; }
  .card { padding: 16px; }
  .kpis { grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; } .kpi { padding: 12px 14px; } .kpi .val { font-size: 24px; } .kpi:last-child { grid-column: 1 / -1; }
  .phva { gap: 8px; } .ph { padding: 12px; }
}
</style>

    if (!tra.value.trim() || !documento || !ven.value) { err.textContent = 'Escribe el trabajador, el documento y la fecha de vencimiento.'; err.hidden = false; return; }
    guardar.disabled = true; guardar.textContent = 'Guardando…';
    const doc = {empresa: emp, trabajador: tra.value.trim().slice(0, 80), cargo: car.value.trim().slice(0, 80), proyecto: pro.value.trim().slice(0, 80), documento: documento.slice(0, 80), expedicion: exp.value || '', vence: ven.value, creado: new Date().toISOString()};
    const id = p ? p.id : (SLUG[emp] + '-' + (doc.trabajador + '-' + doc.documento).normalize('NFD').replace(/[^\w]+/g, '-').toLowerCase()).slice(0, 150);
    try { await DB.collection('personal').doc(id).set(doc); ov.remove(); MODAL = false; toast('Documento guardado.'); render(true); }
    catch (x) { guardar.disabled = false; guardar.textContent = 'Guardar'; err.textContent = 'No se pudo guardar (' + ((x && x.code) || 'error') + '). Inténtalo otra vez.'; err.hidden = false; }
  });
  ov.append(f); document.body.append(ov); (p ? exp : tra).focus();
}
function liveBadge() {
  const t = LIVE === 'vivo' ? (MODO === 'cliente' ? 'Actualizado ' + (SYNC ? fmt(pd(SYNC)) : '') : 'En vivo') : LIVE === 'cargando' ? 'Conectando…' : 'Solo consulta';
  return h('span', {class: 'live ' + LIVE}, h('i'), t);
}
function toast(msg) {
  const t = h('div', {class: 'toast', role: 'status'}, msg); document.body.append(t);
  setTimeout(() => t.classList.add('out'), 2600); setTimeout(() => t.remove(), 3100);
}

function renderKeep() { const y = scrollY; render(); scrollTo({top: y}); }
const _render = render;
render = function (keep) { if (MODAL) return; recompute(); if (keep) { const y = scrollY; _render(); scrollTo({top: y}); } else _render(); };

addEventListener('hashchange', () => { render(); scrollTo({top: 0}); });
render();

(async () => {
  const c = window.claude;
  const [db, user, assets] = await Promise.all([c?.use?.('db') ?? null, c?.use?.('user') ?? null, c?.use?.('assets') ?? null]);
  DB = db; ASSETS = assets;
  let ed = false; try { ed = !!(user && user.canEdit && await user.canEdit()); } catch (e) { ed = false; }
  CAN = MODO !== 'cliente' && !!db && ed;
  if (MODO === 'cliente') return;
  if (!db) { LIVE = 'consulta'; render(true); return; }
  db.collection('personal').onSnapshot((snap) => {
    PERS = snap.docs.map((d) => ({id: d.id, ...d.data()})).filter((x) => x && x.empresa && x.trabajador && x.documento && /^\d{4}-\d{2}-\d{2}$/.test(String(x.vence || '')));
    render(true);
  }, () => {});
  db.collection('evidencias').onSnapshot((snap) => {
    REG = snap.docs.map((d) => ({id: d.id, ...d.data()})).filter((x) => x && x.empresa && x.numero && /^\d{4}-\d{2}-\d{2}$/.test(String(x.fecha || '')));
    LIVE = 'vivo'; render(true);
  }, () => { LIVE = 'consulta'; render(true); });
})();
</script>
